</style></head><body><div class="wrap"><div class="card"><h1>Operating Systems: Combined Quiz</h1><p class="muted">Operating Systems Basics + Process Scheduling & Coordination • 50 questions</p><div class="progress"><div class="bar" id="bar"></div></div><div id="quiz"></div><div id="results"></div></div></div>
<script>
const qs=[{"section": "Definition of Terms", "q": "Which software controls a specific hardware device so the operating system can communicate with it?", "opts": ["Driver", "Linker", "Scheduler", "Semaphore"], "ans": 0}, {"section": "Definition of Terms", "q": "Which operating system interface requires users to type commands?", "opts": ["GUI", "CLI", "BIOS", "MMU"], "ans": 1}, {"section": "Definition of Terms", "q": "What is the computer's main memory that holds active programs and data and is volatile?", "opts": ["ROM", "RAM", "Cache", "Secondary storage"], "ans": 1}, {"section": "Definition of Terms", "q": "Which address is generated by the CPU before it is mapped to an actual hardware memory location?", "opts": ["Physical address", "Logical address", "Partition address", "Segment address"], "ans": 1}, {"section": "Definition of Terms", "q": "Which loading method loads routines only when they are actually needed?", "opts": ["Static loading", "Dynamic loading", "Static linking", "Dynamic partitioning"], "ans": 1}, {"section": "Definition of Terms", "q": "Which allocation strategy chooses the first available block large enough for a process?", "opts": ["Best Fit", "Worst Fit", "First Fit", "Next Fit"], "ans": 2}, {"section": "Definition of Terms", "q": "Which strategy chooses the smallest available block that is large enough?", "opts": ["First Fit", "Best Fit", "Worst Fit", "Next Fit"], "ans": 1}, {"section": "Definition of Terms", "q": "Which strategy chooses the largest available block that can hold the process?", "opts": ["First Fit", "Best Fit", "Worst Fit", "Next Fit"], "ans": 2}, {"section": "Definition of Terms", "q": "Which scheduling algorithm serves the process that arrived first?", "opts": ["SJF", "FCFS", "SRTF", "Round Robin"], "ans": 1}, {"section": "Definition of Terms", "q": "What does IPC stand for?", "opts": ["Internal Process Control", "Interprocess Communication", "Input Process Coordination", "Inter-Partition Communication"], "ans": 1}, {"section": "True or False", "q": "A 64-bit operating system can support much more memory than a 32-bit system.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "An embedded operating system is commonly designed for a specific purpose and limited resources.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "Open-source means the source code is available, but it does not automatically mean the software is free of charge.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "Dynamic loading loads every routine of a program into memory before the program begins.", "opts": ["True", "False"], "ans": 1}, {"section": "True or False", "q": "Paging uses fixed-size pages and fixed-size frames.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "External fragmentation occurs when unused space is scattered outside allocated blocks.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "FCFS is a preemptive scheduling algorithm.", "opts": ["True", "False"], "ans": 1}, {"section": "True or False", "q": "SRTF can interrupt a running process when another process has a shorter remaining time.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "Round Robin gives processes turns using a fixed time quantum.", "opts": ["True", "False"], "ans": 0}, {"section": "True or False", "q": "Mutual exclusion allows several processes to modify the same critical section simultaneously.", "opts": ["True", "False"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: unused space inside an allocated memory block?", "opts": ["External fragmentation", "Internal fragmentation", "Swapping", "Segmentation"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: moving a process between main memory and secondary storage?", "opts": ["Swapping", "Paging", "Linking", "Scheduling"], "ans": 0}, {"section": "Matching Type", "q": "Which term matches: dividing a process into fixed-size pieces placed into fixed-size frames?", "opts": ["Segmentation", "Paging", "Dynamic loading", "Partitioning"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: dividing a process into variable-size logical pieces?", "opts": ["Paging", "Segmentation", "Swapping", "Static loading"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: shortest CPU burst among available processes?", "opts": ["FCFS", "SJF", "Priority", "Round Robin"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: shortest remaining CPU time and can preempt?", "opts": ["SRTF", "FCFS", "SJF", "Priority"], "ans": 0}, {"section": "Matching Type", "q": "Which term matches: a fixed time slice is repeatedly given to processes?", "opts": ["SJF", "Round Robin", "FCFS", "SRTF"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: only one process at a time may access a shared resource?", "opts": ["IPC", "Mutual exclusion", "Throughput", "Turnaround"], "ans": 1}, {"section": "Matching Type", "q": "Which term matches: a part of a program where shared resources are accessed?", "opts": ["Critical section", "Gantt chart", "Ready queue", "Burst time"], "ans": 0}, {"section": "Matching Type", "q": "Which term matches: processes are stuck waiting for resources held by one another?", "opts": ["Starvation", "Deadlock", "Convoy effect", "Fragmentation"], "ans": 1}, {"section": "Situational", "q": "A car's small computer performs one specific control function using limited resources. Which OS type best fits?", "opts": ["Commercial OS", "Embedded OS", "Open-source OS", "Desktop OS"], "ans": 1}, {"section": "Situational", "q": "You manage a server and want to type commands, use scripts, and reduce interface resource usage. Which interface fits?", "opts": ["GUI", "CLI", "Touch interface", "Visual OS"], "ans": 1}, {"section": "Situational", "q": "A newly installed printer does not work because the OS lacks the software needed to communicate with it. What is needed?", "opts": ["A driver", "A linker", "A page table", "A semaphore"], "ans": 0}, {"section": "Situational", "q": "A program has many routines but only some are needed during a particular run. Which approach saves memory by loading routines when needed?", "opts": ["Static loading", "Dynamic loading", "Static linking", "Fixed partitioning"], "ans": 1}, {"section": "Situational", "q": "Free blocks are 100 KB, 500 KB, 200 KB, 300 KB, and 600 KB. A 212 KB process arrives. Which block does Worst Fit choose?", "opts": ["300 KB", "500 KB", "600 KB", "200 KB"], "ans": 2}, {"section": "Situational", "q": "Free blocks are 100 KB, 500 KB, 200 KB, 300 KB, and 600 KB. A 212 KB process arrives. Which block does Best Fit choose?", "opts": ["200 KB", "300 KB", "500 KB", "600 KB"], "ans": 1}, {"section": "Situational", "q": "A process is moved from RAM to disk temporarily so another process can use RAM. What is happening?", "opts": ["Paging", "Swapping", "Segmentation", "Linking"], "ans": 1}, {"section": "Situational", "q": "Two processes both need the same printer, but the OS allows only one to use it at a time. What concept is being applied?", "opts": ["Starvation", "Mutual exclusion", "SRTF", "Throughput"], "ans": 1}, {"section": "Situational", "q": "Process A holds a printer and waits for a scanner, while Process B holds the scanner and waits for the printer. What is this?", "opts": ["Convoy effect", "Deadlock", "Round Robin", "External fragmentation"], "ans": 1}, {"section": "Situational", "q": "A process is running, then a newly arrived higher-priority process immediately takes the CPU. What kind of scheduling is this?", "opts": ["Non-preemptive Priority", "FCFS", "Preemptive Priority", "SJF"], "ans": 2}, {"section": "Problem Solving", "q": "A process arrives at time 4 and completes at time 15. What is its turnaround time?", "opts": ["11", "15", "19", "4"], "ans": 0}, {"section": "Problem Solving", "q": "A process has a turnaround time of 18 units and a burst time of 7 units. What is its waiting time?", "opts": ["11", "25", "7", "18"], "ans": 0}, {"section": "Problem Solving", "q": "Three fixed 100 KB partitions contain processes of 70 KB, 85 KB, and 60 KB. What is the total internal fragmentation?", "opts": ["75 KB", "85 KB", "100 KB", "115 KB"], "ans": 1}, {"section": "Problem Solving", "q": "Free memory consists of 50 KB, 70 KB, and 80 KB. A process needs 180 KB of contiguous memory. What happens?", "opts": ["It fits in the 50 KB block", "It fits in the 80 KB block", "It cannot fit in one block", "It uses all three blocks automatically"], "ans": 2}, {"section": "Problem Solving", "q": "Free blocks are 120 KB, 250 KB, 400 KB, and 500 KB. A 230 KB process arrives. Using First Fit, which block is selected?", "opts": ["120 KB", "230 KB", "250 KB", "400 KB"], "ans": 2}, {"section": "Problem Solving", "q": "Free blocks are 120 KB, 250 KB, 400 KB, and 500 KB. A 230 KB process arrives. Using Best Fit, which block is selected?", "opts": ["120 KB", "250 KB", "400 KB", "500 KB"], "ans": 1}, {"section": "Problem Solving", "q": "Free blocks are 120 KB, 250 KB, 400 KB, and 500 KB. A 230 KB process arrives. Using Worst Fit, which block is selected?", "opts": ["250 KB", "400 KB", "500 KB", "120 KB"], "ans": 2}, {"section": "Problem Solving", "q": "Under FCFS, J1 arrives at 0 with burst 5 and J2 arrives at 1 with burst 3. What is J2's waiting time?", "opts": ["1", "4", "5", "3"], "ans": 1}, {"section": "Problem Solving", "q": "Under SJF, J1 has burst 8 and J2 has burst 3. Both are ready at time 0. Which process runs first?", "opts": ["J1", "J2", "Both simultaneously", "Neither"], "ans": 1}, {"section": "Problem Solving", "q": "Round Robin uses a time quantum of 3. A process has 8 units remaining. How many units can it receive on its next turn?", "opts": ["2", "3", "5", "8"], "ans": 1}];let i=0,score=0,missed=[],locked=false;const qel=document.getElementById('quiz'),rel=document.getElementById('results'),bar=document.getElementById('bar');
function render(){locked=false;bar.style.width=(i/50*100)+'%';let x=qs[i];qel.innerHTML='<div class="tag">'+x.section+' • '+(i+1)+'/50</div><h2>'+x.q+'</h2>'+x.opts.map((o,j)=>'<label class="option"><input type="radio" name="a" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div id="fb" class="feedback"></div><button id="btn" onclick="check()">Check Answer</button>'}
function check(){if(locked)return;let p=document.querySelector('input[name=a]:checked'),fb=document.getElementById('fb');if(!p){fb.className='feedback bad';fb.style.display='block';fb.textContent='Choose an answer first.';return}locked=true;let x=qs[i],v=+p.value;if(v===x.ans){score++;fb.className='feedback ok';fb.textContent='Correct! Keep going!'}else{missed.push([i,x]);fb.className='feedback bad';fb.innerHTML='Not quite. Correct answer: <b>'+x.opts[x.ans]+'</b>'}fb.style.display='block';document.querySelectorAll('input[name=a]').forEach(e=>e.disabled=true);let b=document.getElementById('btn');b.textContent=i===49?'See Results':'Next Question';b.onclick=()=>i===49?finish():(i++,render())}
function finish(){bar.style.width='100%';qel.style.display='none';rel.style.display='block';let pct=Math.round(score/50*100);let s='<h2>Quiz Complete!</h2><div class="score">'+score+'/50</div><p>'+pct+'%</p>';if(missed.length)s+='<h3>Review These</h3>'+missed.map(([n,x])=>'<div class="review"><b>#'+(n+1)+' — '+x.section+'</b><br>'+x.q+'<br><b>Correct:</b> '+x.opts[x.ans]+'</div>').join('');else s+='<p>Perfect score! 🎉</p>';s+='<button onclick="location.reload()">Restart Quiz</button>';rel.innerHTML=s}render();
